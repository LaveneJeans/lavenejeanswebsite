<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LAVENE | Loja</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --ink: #000;
      --mut: #6b6b6b;
      --line: #e4e4e4;
      --soft: #f3f4f6;
      --den: #2f4b6e;
      --r: 10px
    }

    * {
      box-sizing: border-box;
      margin: 0
    }

    body {
      font: 15px/1.5 Archivo, system-ui, sans-serif;
      color: var(--ink);
      background: #fff;
      -webkit-font-smoothing: antialiased
    }

    button,
    input,
    select {
      font: inherit;
      color: inherit
    }

    button {
      cursor: pointer;
      background: none;
      border: 0
    }

    :focus-visible {
      outline: 2px solid var(--den);
      outline-offset: 2px
    }

    .wrap {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 20px
    }

    .bar {
      background: var(--ink);
      color: #fff;
      font-size: 13px;
      text-align: center;
      padding: 8px
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: #fff;
      border-bottom: 1px solid var(--line)
    }

    .hd {
      display: flex;
      align-items: center;
      gap: 20px;
      height: 68px
    }

    .logo {
      color: inherit;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
      font-stretch: 125%;
      font-weight: 800;
      letter-spacing: .22em;
      font-size: 20px
    }

    .mono {
      width: 36px;
      height: 36px;
      border: 2px solid var(--ink);
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 12px;
      letter-spacing: 0;
      font-stretch: 100%
    }

    .search {
      flex: 1;
      max-width: 460px;
      margin-left: auto;
      position: relative
    }

    .search input {
      width: 100%;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 99px;
      padding: 0 16px 0 42px;
      background: var(--soft)
    }

    .search svg {
      position: absolute;
      left: 15px;
      top: 12px;
      width: 18px;
      color: var(--mut)
    }

    .ico {
      position: relative;
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 50%
    }

    .ico:hover {
      background: var(--soft)
    }

    .ico svg {
      width: 22px
    }

    .badge {
      position: absolute;
      top: 2px;
      right: 0;
      min-width: 18px;
      height: 18px;
      border-radius: 9px;
      background: var(--ink);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      display: grid;
      place-items: center;
      padding: 0 4px
    }

    .cats {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 16px 0;
      scrollbar-width: none
    }

    .cats::-webkit-scrollbar {
      display: none
    }

    .chip {
      white-space: nowrap;
      border: 1px solid var(--line);
      border-radius: 99px;
      padding: 7px 16px;
      font-weight: 500
    }

    .chip:hover {
      border-color: var(--ink)
    }

    .chip.on {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink)
    }

    .layout {
      display: grid;
      grid-template-columns: 230px 1fr;
      gap: 40px;
      padding-bottom: 64px
    }

    #filters h3 {
      font-size: 13px;
      font-weight: 700;
      margin: 0 0 10px
    }

    #filters section {
      padding: 18px 0;
      border-top: 1px solid var(--line)
    }

    #filters section:first-child {
      border: 0;
      padding-top: 4px
    }

    .sizes {
      display: flex;
      flex-wrap: wrap;
      gap: 6px
    }

    .sz {
      min-width: 44px;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-weight: 600
    }

    .sz:hover {
      border-color: var(--ink)
    }

    .sz.on {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink)
    }

    .sz:disabled {
      color: #bbb;
      text-decoration: line-through;
      cursor: not-allowed
    }

    input[type=range] {
      width: 100%;
      accent-color: var(--ink)
    }

    .row {
      display: flex;
      justify-content: space-between;
      color: var(--mut);
      font-size: 13px
    }

    select {
      width: 100%;
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 10px;
      background: #fff
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      gap: 12px
    }

    .top b {
      font-size: 22px;
      font-weight: 800;
      font-stretch: 110%
    }

    .top span {
      color: var(--mut);
      font-size: 14px
    }

    .fbtn {
      display: none;
      border: 1px solid var(--ink);
      border-radius: 99px;
      padding: 7px 16px;
      font-weight: 600
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 28px 18px
    }

    .card {
      text-align: left;
      display: block;
      width: 100%
    }

    .ph {
      position: relative;
      aspect-ratio: 3/4;
      background: var(--soft);
      border-radius: var(--r);
      overflow: hidden
    }

    .ph img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .4s
    }

    .card:hover .ph img {
      transform: scale(1.04)
    }

    /* ---- Carrossel (usado nos cards e no modal) ---- */
    .card {
      cursor: pointer
    }

    .card h4 button {
      font: inherit;
      text-align: left;
      padding: 0
    }

    .car {
      position: relative;
      overflow: hidden;
      background: var(--soft)
    }

    .track {
      position: absolute;
      inset: 0;
      display: flex;
      overflow-x: auto;
      overscroll-behavior-x: contain;
      scroll-snap-type: x mandatory;
      scrollbar-width: none
    }

    .track::-webkit-scrollbar {
      display: none
    }

    .track img {
      flex: 0 0 100%;
      width: 100%;
      height: 100%;
      object-fit: cover;
      scroll-snap-align: center;
      scroll-snap-stop: always
    }

    .nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #fff;
      font-size: 22px;
      line-height: 1;
      display: grid;
      place-items: center;
      box-shadow: 0 1px 6px rgba(0, 0, 0, .25)
    }

    .nav.p {
      left: 10px
    }

    .nav.n {
      right: 10px
    }

    .dots {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 7px;
      padding: 7px 11px;
      background: rgba(0, 0, 0, .4);
      border-radius: 99px
    }

    .dots button {
      width: 7px;
      height: 7px;
      border-radius: 4px;
      background: rgba(255, 255, 255, .6);
      transition: width .2s, background .2s
    }

    .dots button.on {
      width: 18px;
      background: #fff
    }

    .cnt {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, .55);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      padding: 3px 11px;
      border-radius: 99px
    }

    .card .nav {
      width: 34px;
      height: 34px;
      font-size: 20px;
      opacity: 0;
      transition: opacity .2s
    }

    .card:hover .nav,
    .card:focus-within .nav {
      opacity: 1
    }

    .card .dots {
      bottom: 8px;
      padding: 5px 8px;
      gap: 5px
    }

    .card .dots button {
      width: 6px;
      height: 6px
    }

    .card .dots button.on {
      width: 14px
    }

    .card .cnt {
      bottom: 8px;
      font-size: 11px
    }

    @media (hover: none) {
      .card .nav {
        display: none
      }
    }

    .tag {
      position: absolute;
      top: 10px;
      left: 10px;
      background: #fff;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 700;
      padding: 3px 10px
    }

    .card h4 {
      font-size: 15px;
      font-weight: 600;
      margin: 10px 0 2px
    }

    .card small {
      color: var(--mut)
    }

    .pr {
      font-weight: 700;
      margin-top: 2px
    }

    .pr s {
      color: var(--mut);
      font-weight: 400;
      margin-left: 6px;
      font-size: 13px
    }

    .pr em {
      font-style: normal;
      color: var(--den)
    }

    .empty {
      grid-column: 1/-1;
      text-align: center;
      padding: 60px 0;
      color: var(--mut)
    }

    .empty button {
      margin-top: 14px;
      border: 1px solid var(--ink);
      border-radius: 99px;
      padding: 8px 20px;
      color: var(--ink);
      font-weight: 600
    }

    .more {
      display: block;
      margin: 36px auto 0;
      border: 1px solid var(--ink);
      border-radius: 99px;
      padding: 11px 32px;
      font-weight: 600
    }

    .more:hover {
      background: var(--ink);
      color: #fff
    }

    .ov {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .5);
      z-index: 40;
      display: none
    }

    .ov.open {
      display: block
    }

    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(420px, 100%);
      background: #fff;
      z-index: 50;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform .3s
    }

    .drawer.open {
      transform: none
    }

    .dh {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 20px;
      border-bottom: 1px solid var(--line)
    }

    .dh b {
      font-size: 18px
    }

    .items {
      flex: 1;
      overflow: auto;
      padding: 8px 20px
    }

    .it {
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 14px;
      padding: 14px 0;
      border-bottom: 1px solid var(--line)
    }

    .it img {
      width: 72px;
      height: 96px;
      object-fit: cover;
      border-radius: 8px;
      background: var(--soft)
    }

    .it h5 {
      font-size: 14px;
      font-weight: 600
    }

    .it small {
      color: var(--mut)
    }

    .qty {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 99px;
      margin-top: 8px
    }

    .qty button {
      width: 30px;
      height: 30px;
      font-size: 16px
    }

    .qty span {
      min-width: 24px;
      text-align: center;
      font-weight: 600
    }

    .rm {
      color: var(--mut);
      font-size: 13px;
      margin-left: 12px;
      text-decoration: underline
    }

    .df {
      padding: 18px 20px;
      border-top: 1px solid var(--line)
    }

    .ship {
      height: 6px;
      background: var(--soft);
      border-radius: 3px;
      overflow: hidden;
      margin: 8px 0 14px
    }

    .ship i {
      display: block;
      height: 100%;
      background: var(--ink);
      transition: width .3s
    }

    .tot {
      display: flex;
      justify-content: space-between;
      font-weight: 700;
      font-size: 17px;
      margin-bottom: 14px
    }

    .btn {
      display: block;
      width: 100%;
      height: 50px;
      border-radius: 99px;
      background: var(--ink);
      color: #fff;
      font-weight: 700
    }

    .btn:hover {
      background: #222
    }

    .btn:disabled {
      background: #bbb;
      cursor: not-allowed
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      place-items: center;
      padding: 16px
    }

    .modal.open {
      display: grid
    }

    .mb {
      position: relative;
      background: #fff;
      border-radius: 16px;
      max-width: 860px;
      width: 100%;
      max-height: 92vh;
      overflow: auto;
      display: grid;
      grid-template-columns: 1fr 1fr
    }

    .mb .car {
      min-height: 420px
    }

    .mi {
      padding: 32px 28px
    }

    .mi h2 {
      font-size: 26px;
      font-weight: 800;
      font-stretch: 110%;
      line-height: 1.15;
      margin: 4px 0 10px
    }

    .mi p {
      color: var(--mut);
      margin: 14px 0
    }

    .x {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 2;
      background: #fff;
      border-radius: 50%
    }

    .msg {
      color: #b00020;
      font-size: 13px;
      min-height: 18px;
      margin: 6px 0
    }

    footer {
      border-top: 1px solid var(--line);
      padding: 28px 0;
      color: var(--mut);
      font-size: 14px
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translate(-50%, 20px);
      background: var(--ink);
      color: #fff;
      padding: 11px 20px;
      border-radius: 99px;
      opacity: 0;
      pointer-events: none;
      transition: .25s;
      z-index: 60;
      font-size: 14px
    }

    .toast.on {
      opacity: 1;
      transform: translate(-50%, 0)
    }

    @media(max-width:860px) {
      .layout {
        grid-template-columns: 1fr
      }

      .fbtn {
        display: block
      }

      #filters {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 50;
        background: #fff;
        border-radius: 18px 18px 0 0;
        padding: 20px;
        max-height: 80vh;
        overflow: auto;
        transform: translateY(105%);
        transition: transform .3s
      }

      #filters.open {
        transform: none
      }

      .logo span.t {
        display: none
      }

      .mb {
        grid-template-columns: 1fr
      }

      .mb .car {
        min-height: 300px;
        aspect-ratio: 4/4
      }

      .grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 22px 12px
      }
    }

    @media(prefers-reduced-motion:reduce) {
      * {
        transition: none !important
      }
    }
  </style>
</head>

<body>

  <div class="bar">Aproveite nossos produtos <span id="fsv"></span> · Direto da fábrica</div>

  <header>
    <div class="wrap hd">
      <a class="logo" href="#">
        <div class="mono">VE</div><span class="t">LAVENE</span>
      </a>
      <label class="search">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="7" />
          <path d="m20 20-4-4" />
        </svg>
        <input id="q" type="search" placeholder="Buscar calça, bermuda, referência…" aria-label="Buscar produtos">
      </label>
      <button class="ico" id="openCart" aria-label="Abrir carrinho">
        <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <path d="M5 8h14l-1 12H6L5 8Z" />
          <path d="M9 8V6a3 3 0 0 1 6 0v2" />
        </svg>
        <span class="badge" id="badge">0</span>
      </button>
    </div>
  </header>

  <main class="wrap">
    <nav class="cats" id="cats" aria-label="Categorias"></nav>
    <div class="layout">
      <aside id="filters" aria-label="Filtros">
        <section>
          <h3>Ordenar</h3>
          <select id="sort">
            <option value="rel">Destaques</option>
            <option value="asc">Menor preço</option>
            <option value="desc">Maior preço</option>
            <option value="az">Nome A–Z</option>
          </select>
        </section>
        <section>
          <h3>Tamanho</h3>
          <div class="sizes" id="sizes"></div>
        </section>
        <section>
          <h3>Preço máximo</h3>
          <input type="range" id="price" aria-label="Preço máximo">
          <div class="row"><span>R$ 0</span><b id="pv"></b></div>
        </section>
        <section><button class="chip" id="clear" style="width:100%">Limpar filtros</button></section>
        <button class="btn" id="applyF" style="display:none;margin-top:8px">Ver resultados</button>
      </aside>

      <section>
        <div class="top">
          <div><b id="title">Todos</b> <span id="count"></span></div>
          <button class="fbtn" id="openF">Filtros</button>
        </div>
        <div class="grid" id="grid"></div>
        <button class="more" id="more" hidden>Ver mais</button>
      </section>
    </div>
  </main>

  <footer>
    <div class="wrap">LAVENE · Atendimento pelo WhatsApp <a id="wa" href="#"
        style="color:var(--ink);font-weight:600"></a></div>
  </footer>

  <div class="ov" id="ov"></div>

  <aside class="drawer" id="drawer" aria-label="Carrinho" aria-hidden="true">
    <div class="dh"><b>Seu carrinho</b><button class="ico" data-close aria-label="Fechar carrinho">✕</button></div>
    <div class="items" id="items"></div>
    <div class="df">
      <div id="shipTxt" style="font-size:13px;color:var(--mut)"></div>
      <div class="ship"><i id="shipBar"></i></div>
      <div class="tot"><span>Subtotal</span><span id="sub">R$ 0,00</span></div>
      <button class="btn" id="checkout">Finalizar pedido</button>
    </div>
  </aside>

  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
  <div class="toast" id="toast" role="status"></div>

  <script>
    /* =========================================================================
       1) CONFIG — ajuste aqui
       ========================================================================= */
    const CONFIG = {
      apiBase: '/api',          // base da sua API
      useApi: false,            // true = busca produtos e envia pedido na SUA API
      whatsapp: '5562994578456',// fallback de checkout (DDI+DDD+número)
      freeShippingFrom: '',
      pageSize: 12,
      imgBase: ''               // prefixo p/ imagens relativas, ex.: 'src/images/catalog/'
    };

    /* =========================================================================
       2) CAMADA DE API — é o único ponto que você precisa conectar ao backend
       Produto esperado (GET /products):
       { id, ref, name, category, price, oldPrice?, tag?, featured?, image,
         description, sizes: ["38","40"...], soldOutSizes?: ["42"] }
       Pedido (POST /orders): { items:[{productId,size,qty}] }
       Resposta esperada: { checkoutUrl } -> o cliente é redirecionado (pagamento)
       ========================================================================= */
    const API = {
      async products() {
        //if (!CONFIG.useApi) return MOCK;
        const r = await fetch('https://lavene-jeans-default-rtdb.firebaseio.com/products.json?auth=');
        if (!r.ok) throw new Error('Falha ao carregar produtos');
        return r.json();
      },
      async checkout(items) {
        if (!CONFIG.useApi) return { whatsapp: true };
        const r = await fetch(CONFIG.apiBase + '/orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ items: items.map(i => ({ productId: i.id, size: i.size, qty: i.qty })) })
        });
        if (!r.ok) throw new Error('Não foi possível criar o pedido');
        return r.json();
      }
    };

    /* Dados de exemplo (apague quando ligar a API) */
    const ph = (c, t) => 'data:image/svg+xml;utf8,' + encodeURIComponent(
      `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400"><rect width="300" height="400" fill="${c}"/><circle cx="150" cy="200" r="34" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="3"/><text x="150" y="207" font-family="sans-serif" font-size="20" font-weight="700" fill="#fff" fill-opacity=".8" text-anchor="middle">VE</text></svg>`);
    const D = 'Jeans com lavagem estável e costuras reforçadas. Troque o texto pela descrição do seu produto.';
    const MOCK = [
      { id: 'LV-101', ref: '1042', name: 'Calça Wide Leg Índigo', category: 'Feminino', price: 169.9, oldPrice: 199.9, tag: 'Novo', featured: 1, image: ph('#2f4b6e'), images: [ph('#2f4b6e'), ph('#27384f'), ph('#6f8fb3')], description: D, sizes: ['36', '38', '40', '42', '44'] },
      { id: 'LV-102', ref: '2085', name: 'Calça Slim Dark', category: 'Masculino', price: 159.9, featured: 1, image: ph('#1c2b40'), images: ['#1c2b40', '#27384f', '#3a4a5c', '#4d6a8c', '#6f8fb3', '#7d9bbd', '#111827', '#2f4b6e'].map(c => ph(c)), description: D, sizes: ['38', '40', '42', '44', '46'], soldOutSizes: ['46'] },
      { id: 'LV-103', ref: '2090', name: 'Calça Skinny Masculina', category: 'Masculino', price: 149.9, image: ph('#3a4a5c'), description: D, sizes: ['38', '40', '42', '44'] },
      { id: 'LV-104', ref: '1051', name: 'Calça Mom Clara', category: 'Feminino', price: 164.9, image: ph('#6f8fb3'), description: D, sizes: ['36', '38', '40', '42'] },
      { id: 'LV-105', ref: '3010', name: 'Bermuda Jeans Reta', category: 'Bermudas', price: 109.9, tag: 'Mais vendido', featured: 1, image: ph('#4d6a8c'), description: D, sizes: ['38', '40', '42', '44', '46'] },
      { id: 'LV-106', ref: '3022', name: 'Short Jeans Cintura Alta', category: 'Bermudas', price: 89.9, images: ['src/images/catalog/sj_001.webp', 'src/images/catalog/sj_001.webp'], description: D, sizes: ['36', '38', '40', '42'] },
      { id: 'LV-107', ref: '4001', name: 'Calça Plus Reta Stretch', category: 'Plus Size', price: 189.9, image: ph('#27384f'), description: D, sizes: ['48', '50', '52', '54', '56'] },
      { id: 'LV-108', ref: '1060', name: 'Calça Flare Black', category: 'Feminino', price: 174.9, tag: 'Novo', image: ph('#111827'), description: D, sizes: ['36', '38', '40', '42', '44'] }
    ];

    /* =========================================================================
       3) ESTADO E UTILITÁRIOS
       ========================================================================= */
    const $ = s => document.querySelector(s);
    const brl = v => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    const store = {
      get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
      set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { } }
    };
    const S = { all: [], q: '', cat: 'Todos', sizes: new Set(), max: 0, sort: 'rel', shown: CONFIG.pageSize, cart: store.get('lavene_cart', []) };
    let maxPrice = 0;

    function toast(m) {
      const t = $('#toast'); t.textContent = m; t.classList.add('on');
      clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2200);
    }
    const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    const byId = id => S.all.find(p => p.id === id);

    /* =========================================================================
       4) CATÁLOGO: filtros + renderização
       ========================================================================= */
    function filtered() {
      const q = norm(S.q.trim());
      let l = S.all.filter(p =>
        (S.cat === 'Todos' || p.category === S.cat) &&
        p.price <= S.max &&
        (!S.sizes.size || p.sizes.some(s => S.sizes.has(s) && !(p.soldOutSizes || []).includes(s))) &&
        (!q || norm(`${p.name} ${p.ref} ${p.category} ${p.description}`).includes(q)));
      const o = {
        asc: (a, b) => a.price - b.price, desc: (a, b) => b.price - a.price,
        az: (a, b) => a.name.localeCompare(b.name), rel: (a, b) => (b.featured || 0) - (a.featured || 0)
      }[S.sort];
      return l.sort(o);
    }

    function renderCats() {
      const cats = ['Todos', ...new Set(S.all.map(p => p.category))];
      $('#cats').innerHTML = cats.map(c => `<button class="chip ${c === S.cat ? 'on' : ''}" data-cat="${c}">${c}</button>`).join('');
      const sizes = [...new Set(S.all.flatMap(p => p.sizes))].sort((a, b) => a - b);
      $('#sizes').innerHTML = sizes.map(s => `<button class="sz ${S.sizes.has(s) ? 'on' : ''}" data-size="${s}">${s}</button>`).join('');
    }

    /* =========================================================================
       CARROSSEL: use `images: [...]` com quantas fotos quiser (ou só `image`)
       - 1 foto: sem controles | 2 a 6: bolinhas | 7 ou mais: contador "3/12"
       ========================================================================= */
    const img = s => /^(https?:|data:|\/)/.test(s) ? s : CONFIG.imgBase + s;
    const pics = p => {
      const l = (Array.isArray(p.images) ? p.images : Object.values(p.images || {})).filter(Boolean);
      return l.length ? l : [p.image || ph('#d1d5db')];
    };
    function carousel(p, cls, extra = '', lazy = false) {
      const l = pics(p), n = l.length;
      const slides = l.map((s, i) => `<img src="${img(s)}" alt="${p.name}${n > 1 ? ' — foto ' + (i + 1) : ''}" draggable="false" ${lazy || i ? 'loading="lazy"' : ''}>`).join('');
      const ctrl = n < 2 ? '' :
        `<button class="nav p" data-nav="-1" aria-label="Foto anterior">‹</button><button class="nav n" data-nav="1" aria-label="Próxima foto">›</button>` +
        (n > 6 ? `<span class="cnt">1/${n}</span>`
          : `<div class="dots">${l.map((_, i) => `<button class="${i ? '' : 'on'}" data-go="${i}" aria-label="Ver foto ${i + 1}"></button>`).join('')}</div>`);
      return `<div class="${cls} car"><div class="track">${slides}</div>${extra}${ctrl}</div>`;
    }
    const trackOf = el => el.closest('.car').querySelector('.track');
    function slide(el, dir) {
      const tr = trackOf(el), n = tr.children.length, i = Math.round(tr.scrollLeft / tr.clientWidth);
      tr.scrollTo({ left: ((i + dir + n) % n) * tr.clientWidth, behavior: 'smooth' });
    }
    function goTo(el, i) { const tr = trackOf(el); tr.scrollTo({ left: i * tr.clientWidth, behavior: 'smooth' }); }
    // um único listener mantém bolinhas/contador de TODOS os carrosséis em dia
    document.addEventListener('scroll', e => {
      const tr = e.target; if (!tr.classList || !tr.classList.contains('track')) return;
      const c = tr.closest('.car'), i = Math.round(tr.scrollLeft / tr.clientWidth);
      c.querySelectorAll('.dots button').forEach((b, k) => b.classList.toggle('on', k === i));
      const t = c.querySelector('.cnt'); if (t) t.textContent = `${i + 1}/${tr.children.length}`;
    }, { capture: true, passive: true });

    function renderGrid() {
      const l = filtered(), v = l.slice(0, S.shown);
      $('#title').textContent = S.cat;
      $('#count').textContent = `${l.length} ${l.length === 1 ? 'produto' : 'produtos'}`;
      $('#pv').textContent = brl(S.max);
      $('#more').hidden = l.length <= S.shown;
      $('#grid').innerHTML = v.length ? v.map(p => `
    <div class="card" data-open="${p.id}">
      ${carousel(p, 'ph', p.tag ? `<span class="tag">${p.tag}</span>` : '', true)}
      <h4><button data-open="${p.id}">${p.name}</button></h4><small>Ref. ${p.ref} · ${p.category}</small>
      <div class="pr">${p.oldPrice ? `<em>${brl(p.price)}</em><s>${brl(p.oldPrice)}</s>` : brl(p.price)}</div>
    </div>`).join('')
        : `<div class="empty"><p>Nenhum produto encontrado com esses filtros.</p><button data-reset>Limpar filtros</button></div>`;
    }

    function refresh() { S.shown = CONFIG.pageSize; renderCats(); renderGrid(); }

    /* =========================================================================
       5) PRODUTO (modal)
       ========================================================================= */
    let pick = null;
    function openProduct(id) {
      const p = byId(id); pick = null;
      const out = p.soldOutSizes || [];
      $('#modal').innerHTML = `
    <div class="ov open" data-close style="z-index:0"></div>
    <div class="mb" style="z-index:1">
      <button class="ico x" data-close aria-label="Fechar">✕</button>
      ${carousel(p, '')}
      <div class="mi">
        <small style="color:var(--mut)">Ref. ${p.ref} · ${p.category}</small>
        <h2>${p.name}</h2>
        <div class="pr" style="font-size:20px">${p.oldPrice ? `<em>${brl(p.price)}</em><s>${brl(p.oldPrice)}</s>` : brl(p.price)}</div>
        <p>${p.description}</p>
        <h3 style="font-size:13px;margin-bottom:8px">Escolha o tamanho</h3>
        <div class="sizes">${p.sizes.map(s => `<button class="sz" data-pick="${s}" ${out.includes(s) ? 'disabled' : ''}>${s}</button>`).join('')}</div>
        <div class="msg" id="msg"></div>
        <button class="btn" data-add="${p.id}">Adicionar ao carrinho</button>
      </div>
    </div>`;
      $('#modal').classList.add('open');
      $('#modal').querySelector('.btn').focus();
    }
    function closeModal() { $('#modal').classList.remove('open'); }

    /* =========================================================================
       6) CARRINHO
       ========================================================================= */
    function addToCart(id) {
      if (!pick) { $('#msg').textContent = 'Escolha um tamanho para continuar.'; return; }
      const it = S.cart.find(i => i.id === id && i.size === pick);
      it ? it.qty++ : S.cart.push({ id, size: pick, qty: 1 });
      saveCart(); closeModal(); toast('Adicionado ao carrinho'); openCart();
    }
    function saveCart() { store.set('lavene_cart', S.cart); renderCart(); }

    function renderCart() {
      S.cart = S.cart.filter(i => byId(i.id));
      const n = S.cart.reduce((a, i) => a + i.qty, 0);
      const sub = S.cart.reduce((a, i) => a + byId(i.id).price * i.qty, 0);
      $('#badge').textContent = n; $('#badge').hidden = !n;
      $('#sub').textContent = brl(sub);
      $('#checkout').disabled = !n;
      const left = CONFIG.freeShippingFrom - sub;
      $('#shipTxt').textContent = !n ? '' : left > 0 ? `Faltam ${brl(left)} para o frete grátis` : 'Você ganhou frete grátis';
      $('#shipBar').style.width = Math.min(100, sub / CONFIG.freeShippingFrom * 100) + '%';
      $('#items').innerHTML = n ? S.cart.map((i, x) => {
        const p = byId(i.id);
        return `<div class="it"><img src="${img(pics(p)[0])}" alt="">
      <div><h5>${p.name}</h5><small>Tamanho ${i.size} · ${brl(p.price)}</small><br>
      <div class="qty"><button data-q="${x}:-1" aria-label="Diminuir">−</button><span>${i.qty}</span><button data-q="${x}:1" aria-label="Aumentar">+</button></div>
      <button class="rm" data-rm="${x}">Remover</button></div></div>`;
      }).join('') : '<p style="color:var(--mut);padding:40px 0;text-align:center">Seu carrinho está vazio.<br>Escolha uma peça e o tamanho para começar.</p>';
    }

    async function checkout() {
      const btn = $('#checkout'); btn.disabled = true; btn.textContent = 'Criando pedido…';
      try {
        const r = await API.checkout(S.cart.map(i => ({ ...i })));
        if (r.checkoutUrl) { location.href = r.checkoutUrl; return; }
        const lines = S.cart.map(i => { const p = byId(i.id); return `• ${p.name} (Ref. ${p.ref}) — Tam ${i.size} — ${i.qty}x — ${brl(p.price * i.qty)}`; });
        const sub = S.cart.reduce((a, i) => a + byId(i.id).price * i.qty, 0);
        const msg = `Olá, Lavene! Quero fazer este pedido:\n\n${lines.join('\n')}\n\nSubtotal: ${brl(sub)}`;
        window.open(`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg)}`, '_blank');
      } catch (e) { toast(e.message); }
      btn.textContent = 'Finalizar pedido'; btn.disabled = !S.cart.length;
    }

    /* =========================================================================
       7) UI: drawers, filtros mobile e eventos
       ========================================================================= */
    function openCart() { $('#drawer').classList.add('open'); $('#drawer').setAttribute('aria-hidden', 'false'); $('#ov').classList.add('open'); }
    function closeAll() {
      $('#drawer').classList.remove('open'); $('#drawer').setAttribute('aria-hidden', 'true');
      $('#filters').classList.remove('open'); $('#ov').classList.remove('open'); closeModal();
    }
    function reset() { S.q = ''; $('#q').value = ''; S.cat = 'Todos'; S.sizes.clear(); S.max = maxPrice; $('#price').value = maxPrice; refresh(); }

    document.addEventListener('click', e => {
      const t = e.target.closest('button,[data-close],[data-open]'); if (!t) return;
      const d = t.dataset;
      if (d.cat) { S.cat = d.cat; refresh(); }
      else if (d.size) { S.sizes.has(d.size) ? S.sizes.delete(d.size) : S.sizes.add(d.size); refresh(); }
      else if (d.open) openProduct(d.open);
      else if (d.nav) slide(t, +d.nav);
      else if (d.go !== undefined) goTo(t, +d.go);
      else if (d.pick) { pick = d.pick; document.querySelectorAll('#modal .sz').forEach(b => b.classList.toggle('on', b === t)); $('#msg').textContent = ''; }
      else if (d.add) addToCart(d.add);
      else if (d.q) { const [x, dl] = d.q.split(':'); S.cart[x].qty += +dl; if (S.cart[x].qty < 1) S.cart.splice(x, 1); saveCart(); }
      else if (d.rm) { S.cart.splice(d.rm, 1); saveCart(); }
      else if ('close' in d) closeAll();
      else if ('reset' in d) reset();
    });
    $('#ov').onclick = closeAll;
    $('#openCart').onclick = openCart;
    $('#checkout').onclick = checkout;
    $('#clear').onclick = reset;
    $('#more').onclick = () => { S.shown += CONFIG.pageSize; renderGrid(); };
    $('#openF').onclick = () => { $('#filters').classList.add('open'); $('#ov').classList.add('open'); $('#applyF').style.display = 'block'; };
    $('#applyF').onclick = closeAll;
    $('#sort').onchange = e => { S.sort = e.target.value; refresh(); };
    $('#price').oninput = e => { S.max = +e.target.value; S.shown = CONFIG.pageSize; renderGrid(); };
    let dt; $('#q').oninput = e => { clearTimeout(dt); dt = setTimeout(() => { S.q = e.target.value; refresh(); }, 200); };
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeAll();
      else if ($('#modal').classList.contains('open') && $('#modal .car')) {
        if (e.key === 'ArrowLeft') slide($('#modal .car'), -1);
        if (e.key === 'ArrowRight') slide($('#modal .car'), 1);
      }
    });

    /* =========================================================================
       8) INÍCIO
       ========================================================================= */
    (async function init() {
      $('#fsv').textContent = brl(CONFIG.freeShippingFrom);
      $('#wa').textContent = '(62) 99457-8456'; $('#wa').href = `https://wa.me/${CONFIG.whatsapp}`;
      try { S.all = await API.products(); }
      catch (e) { $('#grid').innerHTML = `<div class="empty">Não foi possível carregar os produtos. Tente novamente em instantes.</div>`; return; }
      maxPrice = Math.ceil(Math.max(...S.all.map(p => p.price)));
      S.max = maxPrice; $('#price').min = 0; $('#price').max = maxPrice; $('#price').step = 10; $('#price').value = maxPrice;
      refresh(); renderCart();
    })();
  </script>
</body>

</html>
